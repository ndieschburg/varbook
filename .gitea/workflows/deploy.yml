name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, zip
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avz --checksum --delete
            --exclude='.git/'
            --exclude='.gitea/'
            --exclude='.github/'
            --exclude='.claude/'
            --exclude='.idea/'
            --exclude='.vscode/'
            --exclude='.env'
            --exclude='storage/app/public/*'
            --exclude='storage/app/private/*'
            --exclude='storage/app/books/*'
            --exclude='storage/app/locks/*'
            --exclude='storage/app/webdav-locks.dat'
            --exclude='storage/framework/cache/*'
            --exclude='storage/framework/sessions/*'
            --exclude='storage/framework/views/*'
            --exclude='storage/logs/*'
            --exclude='database/database.sqlite'
            --exclude='node_modules/'
            --exclude='tests/'
          path: ./
          remote_path: ${{ secrets.REMOTE_PATH }}
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run post-deploy commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.REMOTE_PATH }}
            php${{ secrets.PHP_VERSION }} artisan migrate --force
            php${{ secrets.PHP_VERSION }} artisan optimize:clear
            php${{ secrets.PHP_VERSION }} artisan storage:link --force
            php${{ secrets.PHP_VERSION }} artisan config:cache
            php${{ secrets.PHP_VERSION }} artisan route:cache
            php${{ secrets.PHP_VERSION }} artisan view:cache
