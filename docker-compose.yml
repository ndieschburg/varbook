services:
  varbook:
    build: .
    container_name: varbook
    restart: unless-stopped
    env_file:
      - .env.docker
      - path: .env.docker.local
        required: false
    ports:
      - "${VARBOOK_PORT:-8080}:80"
    volumes:
      - varbook_storage:/var/www/html/storage/app
      - varbook_logs:/var/www/html/storage/logs
      - varbook_database:/var/www/html/database

volumes:
  varbook_storage:
  varbook_logs:
  varbook_database:
