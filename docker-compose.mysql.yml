# MySQL/MariaDB override — use with:
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d

services:
  varbook:
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: varbook
      DB_USERNAME: varbook
      DB_PASSWORD: "${DB_PASSWORD:-changeme}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    container_name: varbook-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootchangeme}"
      MARIADB_DATABASE: varbook
      MARIADB_USER: varbook
      MARIADB_PASSWORD: "${DB_PASSWORD:-changeme}"
    volumes:
      - varbook_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  varbook_db:
